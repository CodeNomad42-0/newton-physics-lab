<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- 便携单文件版：由 单文件版/build.js 从项目源码自动生成，CSS / JS / 音效全部内联，
     双击即可打开（file:// 亦可）。请勿直接修改本文件，改源码后重新生成。 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>牛顿三定律·交互式物理实验室</title>
<style>
/* ============================================================
   牛顿三定律·交互式物理实验室 — 浅色实验室风样式
   设计分辨率 1280×720，居中按比例自适应缩放（等价原版 canvas_items 拉伸）
   ============================================================ */

/* 中文字体使用系统自带：苹方（Apple）/ 微软雅黑（Windows）/ Noto Sans CJK（Android）。
   原先内置的 16 MB Noto Sans SC（.otf）已移除：它是全站唯一重量级资源（占总体积 99%），
   慢链路下要传十几分钟，会让首屏长时间卡在加载中；系统字体观感几乎一致。 */

:root {
  /* 配色：与 js/constants.js 保持一致 */
  --bg: #e7e4dc;
  --panel: #ffffff;
  --panel-alt: #efede5;
  --canvas: #fbfaf5;
  --header: #eef2f7;
  --header-border: #c7cfdd;
  --panel-border: #dbd6c9;
  --btn-border: #b3ae9e;
  --btn-hover: #f2f0e6;
  --btn-pressed: #e0dbc9;
  --btn-disabled: #ebe9e2;
  --text: #232b36;
  --text-dim: #68727e;
  --force: #e53935;
  --friction: #1e88e5;
  --theory: #2e9e44;
  --highlight: #f57c00;

  --r-card: 12px;
  --r-btn: 10px;
  --r-small: 6px;
  --title-h: 52px;
  --data-h: 216px;
  --panel-w: 372px;

  /* iOS 安全区（刘海 / 灵动岛 / Home 指示条），由 JS 读取后从可用宽高中扣除。
     旧 Safari 不支持 env() 时这些变量为空，JS 侧统一回落为 0，布局不受影响。 */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  /* iOS Safari 在旋转 / 横屏时会自行放大文字，关掉以保持设计比例 */
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  /* 页面本身不需要滚动：禁掉双击缩放（Safari 会忽略 user-scalable=no） */
  touch-action: manipulation;
  background: #d8d5cc;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
               'Microsoft YaHei', 'Noto Sans CJK SC', 'Source Han Sans SC',
               'Helvetica Neue', Arial, sans-serif;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 舞台：固定 1280×720，由 JS 按视口等比缩放 */
#stage {
  position: relative;
  width: 1280px;
  height: 720px;
  flex: 0 0 auto;
  transform-origin: center center;
  background: var(--bg);
  overflow: hidden;
}

.view {
  position: absolute;
  /* 旧 Safari（iOS ≤ 14.4）不支持 inset 简写，用四值兜底 */
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  inset: 0;
}

.hidden { display: none !important; }

/* ============================ 主菜单 ============================ */

.menu-root {
  position: absolute;
  /* 旧 Safari（iOS ≤ 14.4）不支持 inset 简写，用四值兜底 */
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 48px 120px 40px;
}

/* 标题行：主标题居中，右侧放「物理仿真」入口 */
.menu-head {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 58px;
}

.menu-head .btn {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  min-width: 132px;
}

.menu-title {
  margin: 0;
  padding: 0 150px;
  font-size: 34px;
  font-weight: 500;
  text-align: center;
  color: var(--text);
  letter-spacing: 1px;
}

.menu-tag {
  margin: 10px 0 0;
  font-size: 13px;
  text-align: center;
  color: var(--highlight);
}

.menu-cards {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 18px;
  margin: 18px 0;
}

.menu-card {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 18px 24px;
  background: var(--panel);
  border: 2px solid var(--force);
  border-radius: var(--r-card);
}

.menu-card-text { flex: 1 1 auto; }

.menu-card-title {
  margin: 0;
  font-size: 22px;
  font-weight: 500;
}

.menu-card-sub {
  margin: 6px 0 0;
  font-size: 14px;
  color: var(--text-dim);
}

.menu-card .btn { min-width: 160px; height: 52px; }

.menu-hint {
  margin: 0;
  font-size: 13px;
  text-align: center;
  color: var(--text-dim);
}

/* ============================ 标题栏 ============================ */

.title-bar {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: var(--title-h);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  background: var(--header);
  border: 1px solid var(--header-border);
  border-radius: var(--r-card);
}

.title-text {
  font-size: 20px;
  color: var(--text);
  white-space: nowrap;
}

.title-tag {
  font-size: 12px;
  color: var(--highlight);
  white-space: nowrap;
}

.title-spacer { flex: 1 1 auto; }

/* ============================ 按钮 ============================ */

.btn {
  min-height: 44px;
  padding: 8px 16px;
  font-family: inherit;
  font-size: 15px;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--btn-border);
  border-radius: var(--r-btn);
  cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}

.btn:hover { background: var(--btn-hover); border-color: var(--highlight); }
.btn:active { background: var(--btn-pressed); }
.btn:disabled {
  background: var(--btn-disabled);
  border-color: #d4d2ca;
  color: var(--text-dim);
  cursor: not-allowed;
}

.btn-primary {
  color: #fff;
  background: var(--highlight);
  border-color: #d48500;
}

.btn-primary:hover { background: #ffa82a; border-color: #d48500; }
.btn-primary:active { background: #ed8f04; }
.btn-primary:disabled {
  color: var(--text-dim);
  background: var(--btn-disabled);
  border-color: #d4d2ca;
}

.btn-block { display: block; width: 100%; }

/* ============================ 主体布局 ============================ */

.body {
  position: absolute;
  left: 0;
  right: 0;
  top: var(--title-h);
  bottom: var(--data-h);
}

.canvas-panel {
  position: absolute;
  left: 0;
  right: var(--panel-w);
  top: 0;
  bottom: 0;
  background: var(--canvas);
  border: 1px solid var(--panel-border);
  border-radius: var(--r-card);
  overflow: hidden;
}

#physics-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* 画布顶部状态提示（牛三碰撞数值面板等） */
.canvas-note {
  position: absolute;
  left: 0;
  right: 0;
  top: 8px;
  text-align: center;
  font-size: 14px;
  color: var(--force);
  pointer-events: none;
  white-space: pre-line;
  line-height: 1.5;
}

.control-panel {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: var(--panel-w);
  padding: 10px 12px;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--r-card);
  overflow-y: auto;
}

.panel-head {
  margin-bottom: 6px;
  font-size: 16px;
  color: var(--friction);
}

/* ---- 控制面板内部元素 ---- */

.panel-section {
  margin: 8px 0 2px;
  font-size: 13px;
  color: var(--text-dim);
}

.field-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0;
}

.field-label {
  flex: 0 0 108px;
  font-size: 14px;
}

.field-input {
  flex: 1 1 auto;
  min-width: 0;
  height: 34px;
  padding: 0 8px;
  font-family: inherit;
  font-size: 14px;
  color: var(--text);
  text-align: right;
  background: var(--panel);
  border: 1px solid var(--btn-border);
  border-radius: var(--r-small);
}

.field-input:focus {
  outline: none;
  border-color: var(--friction);
  box-shadow: 0 0 0 2px rgba(30, 136, 229, .18);
}

.field-unit {
  flex: 0 0 46px;
  font-size: 13px;
  color: var(--text-dim);
}

.panel-gap { height: 8px; }

.panel-hint {
  margin: 4px 0;
  font-size: 12px;
  line-height: 1.5;
  color: var(--highlight);
  white-space: pre-line;
}

.panel-hint.err { color: var(--force); }

.panel-readout {
  margin: 4px 0;
  font-size: 13px;
  color: var(--force);
  white-space: pre-line;
}

.check-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  font-size: 14px;
  cursor: pointer;
}

.check-row input { width: 18px; height: 18px; accent-color: var(--highlight); }

/* ============================ 数据区 ============================ */

.data-area {
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: 4px;
  height: calc(var(--data-h) - 8px);
  display: flex;
  gap: 8px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--r-card);
  padding: 10px 12px;
  overflow: hidden;
}

.formula-card { flex: 1 1 0; }
.chart-card { flex: 1.4 1 0; display: flex; }

.chart-card canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.formula {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.formula-title { font-size: 15px; color: var(--force); }

.formula-row {
  font-size: 14px;
  line-height: 1.35;
  color: var(--text);
  word-break: break-word;
}

.formula-row.dim { color: var(--text-dim); }
.formula-row.hl { color: var(--highlight); }
.formula-row.pre { white-space: pre-line; }

/* ============================ 物理仿真弹窗 ============================ */

.overlay {
  position: absolute;
  /* 旧 Safari（iOS ≤ 14.4）不支持 inset 简写，用四值兜底 */
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(35, 43, 54, .42);
}

.sim-modal {
  width: 1180px;
  height: 700px;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 2px solid var(--text);
  border-radius: var(--r-card);
  box-shadow: 0 18px 48px rgba(0, 0, 0, .3);
  overflow: hidden;
}

.sim-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: var(--header);
  border-bottom: 1px solid var(--header-border);
}

.sim-head .btn { min-height: 38px; padding: 4px 14px; }

.sim-title { font-size: 20px; color: var(--text); }

.sim-tag { font-size: 12px; color: var(--highlight); }

.sim-main {
  flex: 1 1 auto;
  display: flex;
  gap: 12px;
  padding: 10px 12px;
  min-height: 0;
}

/* 左列：顶部题目类型 + 中部可滚动字段 + 底部固定操作区 */
.sim-panel {
  flex: 0 0 auto;
  width: 330px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sim-panel .panel-section { margin: 6px 0 0; font-size: 12px; }

.sim-fields {
  flex: 1 1 auto;
  min-height: 0;
  padding-right: 4px;
  overflow-y: auto;
}

.sim-panel .field-row { margin: 3px 0; }
.sim-panel .field-input { height: 30px; }
.sim-panel .panel-hint { font-size: 11px; }

.sim-actions {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 8px;
}

.sim-actions .btn { min-height: 40px; }

.sim-types { display: flex; gap: 8px; margin: 6px 0 0; }

.sim-type {
  flex: 1 1 0;
  min-height: 40px;
  padding: 6px 8px;
  font-family: inherit;
  font-size: 14px;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--btn-border);
  border-radius: var(--r-btn);
  cursor: pointer;
}

.sim-type:hover { background: var(--btn-hover); border-color: var(--highlight); }

.sim-type.active {
  color: #fff;
  background: var(--highlight);
  border-color: #d48500;
}

.sim-type.soon { color: var(--text-dim); border-style: dashed; }

.sim-right {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

.sim-derive { flex: 0 0 auto; max-height: 220px; padding: 8px 12px; overflow-y: auto; }

.sim-canvas-card {
  flex: 1 1 auto;
  min-height: 170px;
  background: var(--canvas);
  border: 1px solid var(--panel-border);
  border-radius: var(--r-card);
  overflow: hidden;
}

/* 画布内要按住拖动进度条：触摸交给 JS 处理，避免 Safari 把手势识别成缩放/滚动 */
.sim-canvas-card canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

.sim-canvas-card canvas:focus { outline: none; }

.sim-canvas-card canvas:focus-visible {
  box-shadow: inset 0 0 0 2px rgba(245, 124, 0, .55);
}

/* 图表坞：默认折叠成一条标题栏，点击展开 V-t / X-t */
.chart-dock {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--r-card);
  overflow: hidden;
}

.chart-dock.open { height: 176px; }

.dock-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 36px;
  padding: 4px 12px;
  font-family: inherit;
  font-size: 13px;
  color: var(--text);
  text-align: left;
  background: transparent;
  border: none;
  cursor: pointer;
}

.dock-head:hover { background: var(--btn-hover); }

.dock-title { flex: 1 1 auto; color: var(--text-dim); }

.dock-arrow { font-size: 12px; color: var(--highlight); white-space: nowrap; }

.dock-body { display: none; }

.chart-dock.open .dock-body {
  flex: 1 1 auto;
  display: flex;
  gap: 8px;
  min-height: 0;
  padding: 0 8px 8px;
}

.chart-dock.open .card { padding: 4px 6px; }

.field-input.solved {
  color: var(--highlight);
  border-color: var(--highlight);
  background: #fff8ef;
}

/* ============================================================
   优雅降级：旧 Safari / 能力受限环境下的替代路径
   （新浏览器仍走上面的完整实现，以下规则对它们完全不生效）
   ============================================================ */

/* 极旧环境（无 Canvas 2D）时的整页提示，避免白屏 */
.fallback-note {
  padding: 32px 24px;
  font-size: 16px;
  line-height: 1.8;
  color: var(--text);
  text-align: center;
}

/* iOS Safari 会忽略 user-scalable=no，聚焦字号小于 16px 的输入框时自动放大页面且不会缩回。
   这里只在「触屏 + iOS（可探测 -webkit-touch-callout）」时把输入框字号提到 16px，从根上避免自动缩放。 */
@media (pointer: coarse) {
  @supports (-webkit-touch-callout: none) {
    .field-input { font-size: 16px; }
  }
}

/* 旧 Safari（iOS ≤ 14.0）不支持 flex 的 gap，间距会全部丢失；
   改用相邻兄弟外边距做等效间距。仅在不支持 inset 的浏览器里生效，避免与现代实现叠加。 */
@supports not (inset: 0) {
  .menu-cards > * + * { margin-top: 18px; }
  .menu-card > * + * { margin-left: 20px; }
  .title-bar > * + * { margin-left: 12px; }
  .field-row > * + * { margin-left: 8px; }
  .check-row > * + * { margin-left: 8px; }
  .data-area > * + * { margin-left: 8px; }
  .formula > * + * { margin-top: 6px; }
  .sim-head > * + * { margin-left: 12px; }
  .sim-main > * + * { margin-left: 12px; }
  .sim-actions > * + * { margin-top: 6px; }
  .sim-types > * + * { margin-left: 8px; }
  .sim-right > * + * { margin-top: 10px; }
  .dock-head > * + * { margin-left: 10px; }
  .chart-dock.open .dock-body > * + * { margin-left: 8px; }
}


</style>
</head>
<body>

<div id="stage">

  <!-- ================= 主菜单 ================= -->
  <section id="view-menu" class="view">
    <div class="menu-root">
      <div class="menu-head">
        <h1 class="menu-title">交互式物理实验室 · 调节、观察、验证</h1>
        <button class="btn btn-primary" id="btn-sim" type="button">物理仿真</button>
      </div>
      <p class="menu-tag">对标《物理（必修1）》</p>

      <div class="menu-cards" id="menu-cards"></div>

      <p class="menu-hint">每关提供参数输入框与操作按钮 · 支持触屏操作</p>
    </div>
  </section>

  <!-- ================= 关卡 ================= -->
  <section id="view-level" class="view hidden">

    <!-- 顶部标题栏 -->
    <header class="title-bar">
      <span class="title-text" id="level-title">牛顿三定律 · 交互式物理实验室</span>
      <span class="title-tag" id="level-tag"></span>
      <span class="title-spacer"></span>
      <button class="btn" id="btn-mute" type="button">静音</button>
      <button class="btn" id="btn-back" type="button">← 返回主菜单</button>
    </header>

    <!-- 主体：画布 + 控制面板 -->
    <div class="body">
      <div class="canvas-panel">
        <canvas id="physics-canvas"></canvas>
        <div class="canvas-note" id="canvas-note"></div>
      </div>

      <aside class="control-panel">
        <div class="panel-head">控制面板</div>
        <div id="control-body"></div>
      </aside>
    </div>

    <!-- 数据区：公式看板 + V-t / X-t 图 -->
    <footer class="data-area">
      <div class="card formula-card">
        <div class="formula">
          <div class="formula-title" id="formula-title"></div>
          <div class="formula-row" id="formula-line"></div>
          <div class="formula-row dim" id="formula-sub"></div>
          <div class="formula-row hl" id="formula-result"></div>
        </div>
      </div>
      <div class="card chart-card">
        <canvas id="chart-vt"></canvas>
      </div>
      <div class="card chart-card">
        <canvas id="chart-xt"></canvas>
      </div>
    </footer>

  </section>

  <!-- ================= 物理仿真弹窗 ================= -->
  <div id="sim-overlay" class="overlay hidden">
    <div class="sim-modal">
      <header class="sim-head">
        <span class="sim-title">物理仿真</span>
        <span class="sim-tag" id="sim-type-tag"></span>
        <span class="title-spacer"></span>
        <button class="btn" id="sim-close" type="button">关闭</button>
      </header>

      <div class="sim-main">
        <!-- 左：题目类型 + 数据输入 -->
        <aside class="sim-panel">
          <div class="panel-section">题目类型</div>
          <div class="sim-types" id="sim-types"></div>

          <div class="sim-fields" id="sim-fields"></div>

          <div class="sim-actions">
            <button class="btn btn-primary btn-block" id="sim-solve" type="button">求解并仿真</button>
            <button class="btn btn-block" id="sim-clear" type="button">清空</button>
            <div class="panel-hint" id="sim-hint"></div>
          </div>
        </aside>

        <!-- 右：公式推导 + 运动仿真 + 可折叠图表 -->
        <div class="sim-right">
          <div class="card formula-card sim-derive">
            <div class="formula">
              <div class="formula-title" id="sim-formula-title">公式推导</div>
              <div class="formula-row" id="sim-formula-line">请选择题目类型并输入数据</div>
              <div class="formula-row dim pre" id="sim-formula-sub"></div>
              <div class="formula-row hl" id="sim-formula-result"></div>
            </div>
          </div>

          <div class="sim-canvas-card">
            <canvas id="sim-canvas" tabindex="0"></canvas>
          </div>

<script>
// 全局常量：物理参数 / 坐标标尺 / 浅色实验室风配色（与原 Godot 版 constants.gd 对齐）
const Constants = {
  // ---- 物理 ----
  GRAVITY: 9.8,              // g (m/s²)
  PHYSICS_HZ: 60,            // 固定物理步长 (Hz)
  FIXED_DT: 1.0 / 60.0,      // 单个物理步长 (s)

  // ---- 坐标标尺 ----
  PX_PER_METER: 60.0,        // 物理米 → 屏幕像素
  PX_PER_NEWTON: 20.0,       // 力 N → 箭头像素

  // ---- 配色（浅色实验室风 · 高对比层次） ----
  COLOR_BG: '#e7e4dc',       // 全局背景 暖灰
  COLOR_PANEL: '#ffffff',    // 面板/卡片 纯白
  COLOR_PANEL_ALT: '#efede5',// 面板分隔/浅灰
  COLOR_CANVAS: '#fbfaf5',   // 中央画布 暖白
  COLOR_HEADER: '#eef2f7',   // 标题栏 浅冷灰
  COLOR_GROUND: '#c6c6bd',   // 地面 中灰
  COLOR_BLOCK: '#ffffff',    // 物块/冰球 白
  COLOR_OUTLINE: '#2f3640',  // 物块描边/文字 深墨
  COLOR_TEXT: '#232b36',     // 主文字 深墨
  COLOR_TEXT_DIM: '#68727e', // 次要文字
  COLOR_FORCE: '#e53935',    // 红：主动力/合力
  COLOR_FRICTION: '#1e88e5', // 蓝：摩擦力/阻力
  COLOR_GRAVITY: '#14181d',  // 黑：G/N（虚线）
  COLOR_THEORY: '#2e9e44',   // 绿：理论曲线
  COLOR_HIGHLIGHT: '#f57c00',// 橙：交互提示/高亮
  COLOR_AXIS: '#9aa0a6',     // 图表坐标轴/网格

  // ---- 布局尺寸 ----
  VIEW_W: 1280.0,            // 设计分辨率宽
  VIEW_H: 720.0,             // 设计分辨率高
  BTN_MIN_H: 44.0,           // 触屏最小点击目标高度
};

// ---- 运行环境能力检测：优雅降级用（完整能力 → 旧 Safari 的替代路径） ----
const Env = {
  hasPointer: typeof window.PointerEvent === 'function',   // Pointer Events：iOS 13+ / 现代浏览器
  hasTouch: 'ontouchstart' in window || (navigator.maxTouchPoints | 0) > 0,
  // 触屏设备把 dpr 上限压到 2：iOS 3x 背板会让 canvas 内存翻数倍，2x 视觉几乎无损
  maxDpr: ('ontouchstart' in window || (navigator.maxTouchPoints | 0) > 0) ? 2 : 4,
};

// 无 requestAnimationFrame 的旧浏览器：用定时器模拟，避免主循环完全不启动
if (typeof window.requestAnimationFrame !== 'function') {
  window.requestAnimationFrame = function (cb) {
    return window.setTimeout(function () {
      cb(typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now());
    }, 16);
  };
  window.cancelAnimationFrame = function (id) { window.clearTimeout(id); };
}

// 读取 iOS 安全区（刘海 / 灵动岛 / Home 指示条）
// 旧 Safari 不支持 env() 时 CSS 变量为空，这里统一回落为 0，布局照常
function safeInsets() {
  const cs = window.getComputedStyle(document.documentElement);
  const px = function (name) {
    const v = parseFloat(cs.getPropertyValue(name));
    return isFinite(v) ? v : 0;
  };
  return {
    top: px('--safe-top'),
    right: px('--safe-right'),
    bottom: px('--safe-bottom'),
    left: px('--safe-left'),
  };
}

// 核心能力兜底：完全没有 Canvas 2D 时给一句提示，而不是整页白屏
function hasCanvas2D() {
  try {
    return !!document.createElement('canvas').getContext('2d');
  } catch (e) {
    return false;
  }
}

// 将 #rrggbb 转为 rgba() 字符串
function rgba(hex, a) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}

// 准备 Canvas（适配 devicePixelRatio，返回 {ctx, w, h}，坐标以 CSS 像素计）
function prepareCanvas(canvas) {
  const dpr = Math.min(window.devicePixelRatio || 1, Env.maxDpr);
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (w <= 0 || h <= 0) {
    return { ctx: canvas.getContext('2d'), w: 0, h: 0 };
  }
  const bw = Math.round(w * dpr);
  const bh = Math.round(h * dpr);
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw;
    canvas.height = bh;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

    const node = src.cloneNode(true);
    node.volume = src.volume;

<script>
// 自研纯数学物理引擎（模型层）：60Hz 固定步长解析式计算
// - 一维水平运动，水平向右为正
// - 摩擦方向与运动方向相反；速度过零 clamp 为 0（不被摩擦弹回）
// - 静止时静摩擦抵消施加力，直到 |F| 超过 μ·m·g
class PhysicsEngine {
  constructor() {
    // ---- 配置属性（随时可改，下一物理帧生效） ----
    this.mass = 2.0;              // m (kg)
    this.appliedForce = 0.0;      // 施加力 F (N)，水平向右为正
    this.frictionCoeff = 0.0;     // 动摩擦因数 μ
    this.gravity = Constants.GRAVITY;
    this.v0 = 0.0;                // 初速度 (m/s)
    this.running = false;

    // ---- 内部状态 ----
    this._time = 0;
    this._position = 0;           // s (m)
    this._velocity = 0;           // v (m/s)
    this._acceleration = 0;       // a (m/s²)
    this._netForce = 0;           // F_合 (N)
    this._friction = 0;           // f (N)，带符号
  }

  reset() {
    this._time = 0;
    this._position = 0;
    this._velocity = this.v0;
    this._acceleration = 0;
    this._netForce = 0;
    this._friction = 0;
  }

  setRunning(on) { this.running = on; }

  // 推进一个物理步长
  step(delta) {
    if (!this.running) return;
    this._time += delta;
    this._friction = this._computeFriction();
    this._netForce = this.appliedForce + this._friction;
    let acc = this._netForce / Math.max(this.mass, 0.001);
    let vNew = this._velocity + acc * delta;
    // 速度过零判定：不允许被摩擦弹回反向滑动
    if (this._velocity !== 0 && vNew !== 0 &&
        Math.sign(vNew) !== Math.sign(this._velocity)) {
      // 仅当施加力不足以克服最大静摩擦时才停在 0
      if (Math.abs(this.appliedForce) <= this.frictionCoeff * this.mass * this.gravity) {
        vNew = 0;
        acc = 0;
        this._netForce = 0;
        this._friction = -this.appliedForce;
      }
    }
    // 梯形积分（半平均速度）：对匀变速精确
    const vAvg = (this._velocity + vNew) * 0.5;
    this._velocity = vNew;
    this._acceleration = acc;
    this._position += vAvg * delta;
  }

  isMoving() { return Math.abs(this._velocity) > 1e-9; }

  // 外部改动 appliedForce 后重算 f / F_合 / a（不推进时间）
  recomputeState() {
    this._friction = this._computeFriction();
    this._netForce = this.appliedForce + this._friction;
    this._acceleration = this._netForce / Math.max(this.mass, 0.001);
  }

  // ---- 只读接口 ----
  getPosition() { return this._position; }
  getVelocity() { return this._velocity; }
  getAcceleration() { return this._acceleration; }
  getNetForce() { return this._netForce; }
  getGravityForce() { return this.mass * this.gravity; }
  getNormal() { return this.mass * this.gravity; }
  getFriction() { return this._friction; }
  getFrictionMagnitude() { return this.frictionCoeff * this.mass * this.gravity; }
  getTime() { return this._time; }
  isResting() { return Math.abs(this._velocity) < 1e-9 && Math.abs(this._netForce) < 1e-9; }

  _computeFriction() {
    const fMax = this.frictionCoeff * this.mass * this.gravity;
    if (Math.abs(this._velocity) > 1e-9) {
      return -Math.sign(this._velocity) * fMax;
    }
    // 静止：静摩擦抵消施加力（不超出最大静摩擦）
    return -Math.max(-fMax, Math.min(fMax, this.appliedForce));
  }
}

<script>
// 视图层：矢量受力图绘制器 + 实时图表渲染器（Canvas 2D）

// ---------------- 通用绘图辅助 ----------------

// 绘制箭头（返回实际尖端坐标）。dashed=true 时画虚线（G/N 用）
function drawArrowInto(ctx, from, dir, lenPx, color, dashed, lineWidth) {
  const lw = lineWidth || 3.0;
  const len = Math.abs(lenPx);
  if (len < 0.5) return from;
  const d = Math.hypot(dir.x, dir.y);
  if (d < 1e-9) return from;
  const ux = dir.x / d;
  const uy = dir.y / d;
  const tip = { x: from.x + ux * len, y: from.y + uy * len };

  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = dashed ? 2.5 : lw;
  ctx.lineCap = 'round';
  if (dashed) ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(from.x, from.y);
  ctx.lineTo(tip.x, tip.y);
  ctx.stroke();
  ctx.setLineDash([]);

  // 箭头头部（两条线，保持与原版一致的锥形风格）
  const head = 9.0;
  const px = -uy;
  const py = ux;
  ctx.lineWidth = dashed ? 2.5 : lw;
  ctx.beginPath();
  ctx.moveTo(tip.x, tip.y);
  ctx.lineTo(tip.x - ux * head + px * head * 0.5, tip.y - uy * head + py * head * 0.5);
  ctx.moveTo(tip.x, tip.y);
  ctx.lineTo(tip.x - ux * head - px * head * 0.5, tip.y - uy * head - py * head * 0.5);
  ctx.stroke();
  ctx.restore();
  return tip;
}

// 将 from→tip 射线与边界矩形求交，返回裁剪后的尖端（保证不超出屏幕）
function clipTip(from, tip, bounds) {
  if (tip.x >= bounds.x && tip.x <= bounds.x + bounds.w &&
      tip.y >= bounds.y && tip.y <= bounds.y + bounds.h) {
    return tip;
  }
  const dx = tip.x - from.x;
  const dy = tip.y - from.y;
  if (dx * dx + dy * dy < 1e-9) return tip;
  let t = 1.0;
  if (dx > 0) t = Math.min(t, (bounds.x + bounds.w - from.x) / dx);
  else if (dx < 0) t = Math.min(t, (bounds.x - from.x) / dx);
  if (dy > 0) t = Math.min(t, (bounds.y + bounds.h - from.y) / dy);
  else if (dy < 0) t = Math.min(t, (bounds.y - from.y) / dy);
  t = Math.max(t, 0);
  return { x: from.x + dx * t, y: from.y + dy * t };
}

// ---------------- 矢量受力图绘制器 ----------------

class VectorDrawer {
  constructor() {
    this.arrows = [];   // {from, dir, len, color, dashed, label:{pos,text}}
    this.simplified = false; // 受力透视：true 时隐藏 G/N
    this.showLabels = true;
    this.bounds = null;      // {x,y,w,h} 画布内缩边界
  }

  setBounds(w, h, inset) {
    const m = inset === undefined ? 12 : inset;
    this.bounds = { x: m, y: m, w: Math.max(w - m * 2, 0), h: Math.max(h - m * 2, 0) };
  }

  clear() { this.arrows = []; }

  // pxPerUnit：数值 → 像素的比例，默认按力（N）换算，可传速度比例等
  drawArrow(from, direction, magnitude, color, dashed, label, pxPerUnit) {
    if (Math.abs(magnitude) < 1e-9) return;
    const scale = pxPerUnit || Constants.PX_PER_NEWTON;
    const dirLen = Math.hypot(direction.x, direction.y);
    if (dirLen < 1e-9) return;
    this.arrows.push({
      from: { x: from.x, y: from.y },
      dir: { x: direction.x / dirLen, y: direction.y / dirLen },
      len: Math.abs(magnitude) * scale,
      color,
      dashed: !!dashed,
      label: label || null,
    });
  }

  // 完整受力图：G/N 竖直黑虚线（等长、限长在画布内），f 蓝色水平，F 红色水平
  drawForceBalance(engine, from, canvasH) {
    const gMag = engine.getGravityForce();
    const fFric = engine.getFriction();
    const fApply = engine.appliedForce;

    if (!this.simplified) {
      const rawLen = gMag * Constants.PX_PER_NEWTON;
      let gLen = rawLen;
      if (canvasH > 0 && this.bounds) {
        const margin = 14.0;
        const upSpace = Math.max(from.y - margin, 16.0);
        const downSpace = Math.max(canvasH - from.y - margin, 16.0);
        gLen = Math.min(rawLen, Math.min(upSpace, downSpace) * 0.92);
      }
      this.drawArrow(from, { x: 0, y: 1 }, gLen / Constants.PX_PER_NEWTON,
        Constants.COLOR_GRAVITY, true,
        this.showLabels ? { pos: { x: from.x + 10, y: from.y + gLen * 0.5 + 14 }, text: 'G' } : null);
      this.drawArrow(from, { x: 0, y: -1 }, gLen / Constants.PX_PER_NEWTON,
        Constants.COLOR_GRAVITY, true,
        this.showLabels ? { pos: { x: from.x + 10, y: from.y - gLen * 0.5 - 6 }, text: 'N' } : null);
    }

    if (Math.abs(fFric) > 1e-9) {
      // fFric 已带符号（与运动方向相反），箭头方向取其符号
      const sgn = Math.sign(fFric);
      const label = this.showLabels
        ? { pos: { x: from.x + sgn * Math.abs(fFric) * Constants.PX_PER_NEWTON + sgn * 10, y: from.y - 18 }, text: 'f' }
        : null;
      this.drawArrow(from, { x: sgn, y: 0 }, Math.abs(fFric), Constants.COLOR_FRICTION, false, label);
    }
    if (Math.abs(fApply) > 1e-9) {
      const sgn = Math.sign(fApply);
      const label = this.showLabels
        ? { pos: { x: from.x + sgn * Math.abs(fApply) * Constants.PX_PER_NEWTON + sgn * 8, y: from.y + 26 }, text: 'F' }
        : null;
      this.drawArrow(from, { x: sgn, y: 0 }, Math.abs(fApply), Constants.COLOR_FORCE, false, label);
    }
  }

  // 简化模式下绘制水平合力箭头（红色，稍放大强调）
  drawNetForceArrow(engine, from) {
    const net = engine.getNetForce();
    if (Math.abs(net) < 1e-9) return;
    const sgn = Math.sign(net);
    const lenPx = Math.abs(net) * Constants.PX_PER_NEWTON * 1.2;
    this.arrows.push({
      from: { x: from.x, y: from.y },
      dir: { x: sgn, y: 0 },
      len: lenPx,
      color: Constants.COLOR_FORCE,
      dashed: false,
      label: this.showLabels ? { pos: { x: from.x + sgn * lenPx + 4, y: from.y - 26 }, text: 'F_合' } : null,
    });
  }

  // 提交绘制到 canvas 上下文
  render(ctx, font) {
    ctx.save();
    for (const a of this.arrows) {
      let tip = { x: a.from.x + a.dir.x * a.len, y: a.from.y + a.dir.y * a.len };
      if (this.bounds) tip = clipTip(a.from, tip, this.bounds);
      drawArrowInto(ctx, a.from, a.dir, Math.hypot(tip.x - a.from.x, tip.y - a.from.y), a.color, a.dashed);
    }
    if (font) {
      ctx.font = `16px ${font}`;
      ctx.fillStyle = Constants.COLOR_TEXT;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      for (const a of this.arrows) {
        if (!a.label) continue;
        ctx.fillText(a.label.text, a.label.pos.x, a.label.pos.y);
      }
    }
    ctx.restore();
  }
}

// ---------------- 实时图表渲染器 ----------------

const ChartType = { V_T: 'V_T', X_T: 'X_T' };

class ChartRenderer {
  constructor(type, timeWindow) {
    this.type = type || ChartType.V_T;
    this.timeWindow = timeWindow || 10.0;
    this.title = this.type === ChartType.V_T ? 'V-t 图' : 'X-t 图';
    this.autoScale = true;
    this.fixedMin = 0;
    this.fixedMax = 10;
    this.gridStep = 2.0; // 时间轴网格步长 (s)，短时演示可调小
    this.showTheory = true;
    this._times = [];
    this._values = [];
    this._theoryFunc = null;
    this._tLatest = 0;
    this._padL = 46;
    this._padR = 12;
    this._padT = 26;
    this._padB = 26;
  }

  setup(type, timeWindow) {
    this.type = type;
    if (timeWindow !== undefined) this.timeWindow = timeWindow;
    this.title = this.type === ChartType.V_T ? 'V-t 图' : 'X-t 图';
  }

  setTitle(t) { this.title = t; }
  setAutoScale(on) { this.autoScale = on; }
  setFixedRange(a, b) { this.fixedMin = a; this.fixedMax = b; }
  setTheoryFunc(fn) { this._theoryFunc = fn; }
  setShowTheory(on) { this.showTheory = on; }
  hasData() { return this._times.length > 0; }

  pushValue(t, v) {
    this._tLatest = t;
    this._times.push(t);
    this._values.push(v);
    // 裁剪窗口外的旧点
    const cutoff = this._tLatest - this.timeWindow;
    let keep = -1;
    for (let i = 0; i < this._times.length; i++) {
      if (this._times[i] >= cutoff) { keep = i; break; }
    }
    if (keep > 0) {
      this._times = this._times.slice(keep);
      this._values = this._values.slice(keep);
    }
  }

  clear() {
    this._times = [];
    this._values = [];
    this._tLatest = 0;
  }

  _timeToX(plot, t) {
    return plot.x + (t - (this._tLatest - this.timeWindow)) / this.timeWindow * plot.w;
  }

  _toScreen(plot, t, v, vmin, vmax) {
    const x = this._timeToX(plot, t);
    const y = plot.y + (vmax - v) / (vmax - vmin) * plot.h;
    return { x, y };
  }

  render(canvas, font) {
    const { ctx, w, h } = prepareCanvas(canvas);
    if (w <= 10 || h <= 10) return;
    const plot = {
      x: this._padL,
      y: this._padT,
      w: Math.max(w - this._padL - this._padR, 0),
      h: Math.max(h - this._padT - this._padB, 0),
    };
    if (plot.w <= 5 || plot.h <= 5) return;

    ctx.clearRect(0, 0, w, h);
    // 背景
    ctx.fillStyle = rgba('#ffffff', 0.9);
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = Constants.COLOR_PANEL_ALT;
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, w - 1, h - 1);

    // 纵轴范围
    let vmin, vmax;
    if (this.autoScale) {
      let lo = Infinity, hi = -Infinity;
      for (const v of this._values) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
      if (this._theoryFunc && this.showTheory) {
        const t0 = this._tLatest - this.timeWindow;
        const n = 100;
        for (let i = 0; i <= n; i++) {
          const tt = t0 + this.timeWindow * i / n;
          if (tt < 0) continue;
          const y = this._theoryFunc(tt);
          lo = Math.min(lo, y); hi = Math.max(hi, y);
        }
      }
      if (!isFinite(lo)) { lo = 0; hi = 1; }
      if (Math.abs(hi - lo) < 1e-6) { lo -= 1; hi += 1; }
      const pad = (hi - lo) * 0.12;
      vmin = lo - pad;
      vmax = hi + pad;
    } else {
      vmin = this.fixedMin;
      vmax = this.fixedMax;
    }

    const fam = font || 'sans-serif';
    // 标题与纵轴单位
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = Constants.COLOR_TEXT;
    ctx.font = `12px ${fam}`;
    ctx.fillText(this.title, plot.x + 4, plot.y + 2);
    ctx.fillStyle = Constants.COLOR_TEXT_DIM;
    ctx.font = `10px ${fam}`;
    ctx.fillText(this.type === ChartType.V_T ? 'v (m/s)' : 'x (m)', plot.x + 60, plot.y + 14);

    // 横向网格与刻度（纵轴 5 等分）
    for (let i = 0; i <= 5; i++) {
      const frac = i / 5;
      const y = plot.y + plot.h * frac;
      const val = vmax - (vmax - vmin) * frac;
      ctx.strokeStyle = rgba('#d9d9d9', 0.6);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(plot.x, y);
      ctx.lineTo(plot.x + plot.w, y);
      ctx.stroke();
      ctx.fillStyle = Constants.COLOR_TEXT_DIM;
      ctx.font = `10px ${fam}`;
      ctx.textAlign = 'right';
      ctx.fillText(val.toFixed(1), plot.x - 6, y + 4);
      ctx.textAlign = 'left';
    }

    // 垂直网格线：绑定到具体时刻，按 gridStep 递增，随数据左移
    const gStep = this.gridStep > 0 ? this.gridStep : 2.0;
    let gi = Math.max(Math.ceil((this._tLatest - this.timeWindow) / gStep - 1e-9), 0);
    let tau = gi * gStep;
    while (tau <= this._tLatest + 1e-6) {
      const x = this._timeToX(plot, tau);
      ctx.strokeStyle = rgba('#d9d9d9', 0.6);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, plot.y);
      ctx.lineTo(x, plot.y + plot.h);
      ctx.stroke();
      ctx.fillStyle = Constants.COLOR_TEXT_DIM;
      ctx.font = `10px ${fam}`;
      ctx.fillText(gStep < 1 ? tau.toFixed(1) : String(Math.round(tau)), x - 6, plot.y + plot.h + 14);
      gi += 1;
      tau = gi * gStep;
    }

    // 坐标轴（左 + 下）
    ctx.strokeStyle = Constants.COLOR_OUTLINE;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(plot.x, plot.y);
    ctx.lineTo(plot.x, plot.y + plot.h);
    ctx.moveTo(plot.x, plot.y + plot.h);
    ctx.lineTo(plot.x + plot.w, plot.y + plot.h);
    ctx.stroke();
    ctx.fillStyle = Constants.COLOR_TEXT_DIM;
    ctx.font = `10px ${fam}`;
    ctx.textAlign = 'right';
    ctx.fillText('t (s)', plot.x + plot.w, plot.y + plot.h + 14);
    ctx.textAlign = 'left';

    // 理论曲线（半透明绿色虚线）
    if (this.showTheory && this._theoryFunc && this._tLatest > 0) {
      const t0 = this._tLatest - this.timeWindow;
      const pts = [];
      const n = 200;
      for (let i = 0; i <= n; i++) {
        const tt = t0 + this.timeWindow * i / n;
        if (tt < 0) continue;
        pts.push(this._toScreen(plot, tt, this._theoryFunc(tt), vmin, vmax));
      }
      if (pts.length > 1) {
        ctx.save();
        ctx.strokeStyle = rgba(Constants.COLOR_THEORY, 0.7);
        ctx.lineWidth = 1.8;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.stroke();
        ctx.restore();
      }
    }

    // 实测曲线（黑色实线）
    if (this._times.length > 1) {
      ctx.save();
      ctx.strokeStyle = Constants.COLOR_TEXT;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let i = 0; i < this._times.length; i++) {
        const p = this._toScreen(plot, this._times[i], this._values[i], vmin, vmax);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
      ctx.restore();
    }
  }
}

// ---------------- 坐标纸网格背景 ----------------

// 网格 = 世界坐标系：垂直整数米线随相机 scroll 平移，原点线加粗
function drawGrid(ctx, w, h, scroll) {
  const step = Constants.PX_PER_METER;
  if (step <= 0 || w <= 1 || h <= 1) return;
  const kMin = Math.floor(scroll / step) - 1;
  const kMax = Math.ceil((scroll + w) / step) + 1;
  for (let k = kMin; k <= kMax; k++) {
    const x = k * step - scroll;
    if (k === 0) {
      ctx.strokeStyle = Constants.COLOR_AXIS;
      ctx.lineWidth = 1.5;
    } else {
      ctx.strokeStyle = rgba(Constants.COLOR_AXIS, 0.34);
      ctx.lineWidth = 1;
    }
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();
  }
  ctx.strokeStyle = rgba(Constants.COLOR_AXIS, 0.22);
  ctx.lineWidth = 1;
  let y = step;
  while (y < h) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
    y += step;
  }
}

// 地面线（含阴影层次），与原版一致：默认位于画布高度 72% 处（ratio 可覆盖）
function drawGround(ctx, w, h, ratio) {
  const gy = h * (ratio === undefined ? 0.72 : ratio);
  ctx.strokeStyle = Constants.COLOR_GROUND;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, gy);
  ctx.lineTo(w, gy);
  ctx.stroke();
  for (let i = 0; i < 3; i++) {
    ctx.strokeStyle = `rgba(204,204,199,${0.5 - i * 0.12})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, gy + 6 + i * 5);
    ctx.lineTo(w, gy + 6 + i * 5);
    ctx.stroke();
  }
}

</script>
<script>
// 关卡实现（视图 + 控制器）：主菜单 + 三关，均为"按钮式"，参数用数字输入框

// ---------------- 工具函数 ----------------

function clampNum(v, a, b) { return Math.max(a, Math.min(b, v)); }

function makeEl(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

// ---------------- 关卡公共骨架 ----------------

class LevelBase {
  constructor(game) {
    this.game = game;
    this.engine = new PhysicsEngine();
    this.vectorDrawer = new VectorDrawer();
    this.chartVT = new ChartRenderer(ChartType.V_T, 10.0);
    this.chartXT = new ChartRenderer(ChartType.X_T, 10.0);
    this.camScroll = 0;
    this.simTime = 0;
    this.fields = {};
    this.panel = null;
    this.blockY = null;
    this._readouts = {};
  }

  get title() { return '牛顿三定律 · 交互式物理实验室'; }
  get tag() { return ''; }

  // ---- 面板构建辅助 ----
  build(panel) {
    this.panel = panel;
    panel.innerHTML = '';
  }

  sectionTitle(text) {
    this.panel.appendChild(makeEl('div', 'panel-section', text));
  }

  spacer(h) {
    const s = makeEl('div', 'panel-gap');
    s.style.height = (h || 8) + 'px';
    this.panel.appendChild(s);
  }

  // 数字输入框（取代原滑块）：label + <input type=number> + 单位
  addField(key, opts) {
    const row = makeEl('div', 'field-row');
    row.appendChild(makeEl('span', 'field-label', opts.label));

    const input = makeEl('input', 'field-input');
    input.type = 'number';
    input.min = String(opts.min);
    input.max = String(opts.max);
    input.step = String(opts.step);
    input.value = String(opts.value);
    row.appendChild(input);
    row.appendChild(makeEl('span', 'field-unit', opts.unit || ''));

    const apply = (raw, rewrite) => {
      const parsed = parseFloat(raw);
      if (Number.isNaN(parsed)) return;
      const v = clampNum(parsed, opts.min, opts.max);
      if (rewrite && String(v) !== input.value) input.value = String(v);
      this.fields[key] = v;
      if (opts.onChange) opts.onChange(v);
    };

    input.addEventListener('input', () => apply(input.value, false));
    input.addEventListener('change', () => {
      // 失焦/回车时归一化：缺失或越界都写回合法值
      const parsed = parseFloat(input.value);
      if (Number.isNaN(parsed)) input.value = String(this.fields[key]);
      else apply(input.value, true);
    });

    this.panel.appendChild(row);
    this.fields[key] = clampNum(opts.value, opts.min, opts.max);
    this._inputs = this._inputs || {};
    this._inputs[key] = input;
    // 注册即同步初始值到物理引擎（与原滑块注册行为一致，保证默认参数生效）
    if (opts.onChange) opts.onChange(this.fields[key]);
    return input;
  }

  setField(key, v) {
    this.fields[key] = v;
    if (this._inputs && this._inputs[key]) this._inputs[key].value = String(v);
  }

  getVal(key) {
    const v = this.fields[key];
    return v === undefined ? 0 : v;
  }

  addButton(text, cls, onClick, block) {
    const b = makeEl('button', 'btn' + (cls ? ' ' + cls : '') + (block === false ? '' : ' btn-block'), text);
    b.type = 'button';
    b.addEventListener('click', () => {
      AudioManager.playClick();
      onClick();
    });
    this.panel.appendChild(b);
    return b;
  }

  addHint(text) {
    this.panel.appendChild(makeEl('div', 'panel-hint', text));
  }

  addReadout(key, initial) {
    const e = makeEl('div', 'panel-readout', initial || '');
    this.panel.appendChild(e);
    this._readouts[key] = e;
    return e;
  }

  setReadout(key, text) {
    const e = this._readouts[key];
    if (e) e.textContent = text;
  }

  addCheckbox(label, checked, onChange) {
    const wrap = makeEl('label', 'check-row');
    const input = makeEl('input');
    input.type = 'checkbox';
    input.checked = !!checked;
    input.addEventListener('change', () => onChange(input.checked));
    wrap.appendChild(input);
    wrap.appendChild(makeEl('span', null, label));
    this.panel.appendChild(wrap);
    return input;
  }

  // ---- 相机跟随（网格 = 世界坐标系，随物块适应性平移） ----
  resetCamera() {
    this.camScroll = 0;
    if (this.game.note) this.game.note.textContent = '';
  }

  worldToScreenX(worldXm) {
    const w = worldXm * Constants.PX_PER_METER;
    const cw = this.game.canvas.clientWidth;
    if (cw > 0) {
      const l = cw * 0.10;
      const r = cw * 0.62;
      const sx = w - this.camScroll;
      if (sx > r) this.camScroll = w - r;
      else if (sx < l) this.camScroll = w - l;
    }
    return w - this.camScroll;
  }

  // ---- 图表数据 ----
  pushCharts() {
    this.chartVT.pushValue(this.simTime, this.engine.getVelocity());
    this.chartXT.pushValue(this.simTime, this.engine.getPosition());
  }

  clearCharts() {
    this.chartVT.clear();
    this.chartXT.clear();
  }

  // ---- 生命周期（子类覆盖） ----
  setup() {}
  reset() {}
  stepPhysics(dt) {
    if (this.engine.running) {
      this.engine.step(dt);
      this.simTime += dt;
      this.pushCharts();
    }
  }
  render() {}
  updateFormula() {}

  // ---- 公共绘制：网格 + 地面 ----
  drawScene(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = Constants.COLOR_CANVAS;
    ctx.fillRect(0, 0, w, h);
    drawGrid(ctx, w, h, this.camScroll);
    drawGround(ctx, w, h);
  }
}

// ---------------- 关卡一 · 牛一定律（惯性迷局） ----------------

class LevelOne extends LevelBase {
  constructor(game) {
    super(game);
    this.START_X = 2.5;
    this.V0_PUSH = 5.0;
    this.MASS = 2.0;
    this.HALF_W = 34;
    this.HALF_H = 30;
  }

  get title() { return '关卡一 · 惯性迷局'; }
  get tag() { return '牛顿第一定律 · 惯性 · 必修1 §1.1.3'; }

  setup() {
    this.build(this.game.controlBody);
    this.engine.mass = this.MASS;
    this.engine.v0 = this.V0_PUSH;
    this.engine.frictionCoeff = 0.2;

    this.sectionTitle('参数调节');
    this.addField('mu', {
      label: '摩擦系数 μ', min: 0, max: 0.8, step: 0.01, value: 0.2, unit: '',
      onChange: (v) => { this.engine.frictionCoeff = v; this.engine.recomputeState(); this.updateFormula(); },
    });

    this.spacer(4);
    this.sectionTitle('操作');
    this.pushBtn = this.addButton('推一下（v₀=5 m/s）', 'btn-primary', () => this.onPush());
    this.spacer(4);

    this.sectionTitle('显示');
    this.addCheckbox('受力透视（显示 G/N）', true, (on) => {
      this.vectorDrawer.simplified = !on;
      this.setReadout('simp', on ? '' : '简化模式：G 与 N 等大反向抵消，仅显示水平合力');
    });
    this.addReadout('simp', '');

    this.spacer(4);
    this.addHint('点击「推一下」给物块初速度，观察 μ 变化对滑行距离的影响：\nμ=0 时 V-t 图为水平直线（匀速）；μ>0 时斜率为负（匀减速）。');

    this.addReadout('fs', 'F = 0.00 N');
    this.spacer(4);
    this.addButton('重置', null, () => { this.reset(); this.engine.running = false; });

    this.chartVT.setTitle('V-t 图');
    this.chartXT.setTitle('X-t 图');
    this.chartVT.setTheoryFunc((t) => this.theoryV(t));
    this.chartXT.setTheoryFunc((t) => this.theoryS(t));
    this.chartVT.setAutoScale(false);
    this.chartVT.setFixedRange(0, 6);

    this.game.setFormulaTitle('摩擦力与合力');
    this.reset();
  }

  onPush() {
    this.engine.v0 = this.V0_PUSH;
    this.engine.reset();
    this.engine.recomputeState();
    this.engine.running = true;
    this.resetCamera();
    this.simTime = 0;
    this.clearCharts();
    this.setReadout('fs', 'F = 0.00 N（撤去推力，惯性滑行）');
  }

  reset() {
    this.engine.v0 = this.V0_PUSH;
    this.engine.reset();
    this.engine.appliedForce = 0;
    this.engine.recomputeState();
    this.engine.running = false;
    this.resetCamera();
    this.simTime = 0;
    this.clearCharts();
    this.setReadout('fs', 'F = 0.00 N');
    this.updateFormula();
  }

  updateFormula() {
    const mu = this.engine.frictionCoeff;
    const m = this.engine.mass;
    const g = this.engine.gravity;
    const f = mu * m * g;
    const fPush = this.engine.appliedForce;
    const net = fPush - f;
    this.game.setFormula('F_合 = F_推 − μ·m·g        f = μ·m·g');
    this.game.setSubstitution(
      `F_合 = ${fPush.toFixed(2)} − ${mu.toFixed(2)}×${m.toFixed(2)}×${g.toFixed(2)} = ${net.toFixed(2)} N    f = ${f.toFixed(2)} N`);
    this.game.setResult(
      `a = F_合/m = ${this.engine.getAcceleration().toFixed(2)} m/s²    v = ${this.engine.getVelocity().toFixed(2)} m/s`);
  }

  theoryV(t) {
    const a = -this.engine.frictionCoeff * this.engine.gravity;
    return Math.max(this.V0_PUSH + a * t, 0);
  }

  theoryS(t) {
    const a = -this.engine.frictionCoeff * this.engine.gravity;
    if (a < -1e-9) {
      const tStop = -this.V0_PUSH / a;
      const tc = Math.min(t, tStop);
      return this.V0_PUSH * tc + 0.5 * a * tc * tc;
    }
    return this.V0_PUSH * t;
  }

  render() {
    const { ctx, w, h } = prepareCanvas(this.game.canvas);
    if (w <= 10 || h <= 10) return;
    this.drawScene(ctx, w, h);

    if (this.blockY === null) this.blockY = h * 0.72 - this.HALF_H;
    const worldX = this.START_X + this.engine.getPosition();
    const sx = this.worldToScreenX(worldX);
    const cy = this.blockY;

    // 物块
    ctx.fillStyle = Constants.COLOR_BLOCK;
    ctx.strokeStyle = Constants.COLOR_OUTLINE;
    ctx.lineWidth = 2.5;
    ctx.fillRect(sx - this.HALF_W, cy - this.HALF_H, this.HALF_W * 2, this.HALF_H * 2);
    ctx.strokeRect(sx - this.HALF_W, cy - this.HALF_H, this.HALF_W * 2, this.HALF_H * 2);

    // 受力图
    this.vectorDrawer.setBounds(w, h, 12);
    this.vectorDrawer.clear();
    this.vectorDrawer.drawForceBalance(this.engine, { x: sx, y: cy }, h);
    if (this.vectorDrawer.simplified) {
      this.vectorDrawer.drawNetForceArrow(this.engine, { x: sx, y: cy });
    }
    this.vectorDrawer.render(ctx, this.game.fontFamily());

    this.updateFormula();
  }
}

// ---------------- 关卡二 · 牛二定律（加速度工坊） ----------------

class LevelTwo extends LevelBase {
  constructor(game) {
    super(game);
    this.START_X = 7.0;
    this.HALF_W = 34;
    this.HALF_H = 30;
    this.started = false;
  }

  get title() { return '关卡二 · 加速度工坊'; }
  get tag() { return '牛顿第二定律 F=m·a · 必修1 §1.2.3'; }

  setup() {
    this.build(this.game.controlBody);
    this.engine.mass = 2.0;
    this.engine.frictionCoeff = 0.0;
    this.engine.v0 = 0.0;

    this.sectionTitle('参数调节');
    this.addField('F', {
      label: '施加力 F', min: 1, max: 20, step: 0.5, value: 1.0, unit: 'N',
      onChange: (v) => {
        // 运行中实时生效
        if (this.started && this.engine.running) {
          this.engine.appliedForce = v;
          this.engine.recomputeState();
        }
        this.updateFormula();
      },
    });
    this.addField('m', {
      label: '质量 m', min: 1, max: 10, step: 0.5, value: 1.0, unit: 'kg',
      onChange: (v) => { this.engine.mass = v; this.engine.recomputeState(); this.updateFormula(); },
    });
    this.addField('v0', {
      label: '初速度 v₀', min: -10, max: 10, step: 0.5, value: 0, unit: 'm/s',
      onChange: (v) => { if (!this.started) this.engine.v0 = v; this.updateFormula(); },
    });
    this.addField('mu', {
      label: '摩擦系数 μ', min: 0, max: 0.8, step: 0.01, value: 0, unit: '',
      onChange: (v) => { this.engine.frictionCoeff = v; this.engine.recomputeState(); this.updateFormula(); },
    });

    this.spacer(4);
    this.sectionTitle('操作');
    this.runBtn = this.addButton('运行', 'btn-primary', () => this.onRunPause());
    this.addReadout('fs', 'F = 0.00 N');
    this.spacer(4);
    this.addHint('彩蛋：设 v₀ 为负、F 为正，观察 V-t 图穿过零点——先减速后反向加速。\nμ 默认 0（光滑面），调大 μ 可观察摩擦减速；一切遵循 F_合 = m·a。');
    this.addButton('重置', null, () => this.reset());

    this.chartVT.setTitle('V-t 图（斜率 = 加速度）');
    this.chartXT.setTitle('X-t 图');
    this.chartVT.setTheoryFunc((t) => this.theoryV(t));
    this.chartXT.setTheoryFunc((t) => this.theoryS(t));
    this.chartVT.setAutoScale(true);

    this.game.setFormulaTitle('牛顿第二定律 F = m·a');
    this.reset();
  }

  onRunPause() {
    if (this.engine.running) {
      this.engine.running = false;
      this.runBtn.textContent = '继续';
      return;
    }
    if (!this.started) {
      this.applyParamsAndStart();
      this.runBtn.textContent = '暂停';
    } else {
      this.engine.running = true;
      this.runBtn.textContent = '暂停';
    }
  }

  applyParamsAndStart() {
    this.engine.v0 = this.getVal('v0');
    this.engine.mass = this.getVal('m');
    this.engine.frictionCoeff = this.getVal('mu');
    this.engine.reset();
    this.engine.appliedForce = this.getVal('F');
    this.engine.recomputeState();
    this.engine.running = true;
    this.started = true;
    this.simTime = 0;
    this.clearCharts();
    this.resetCamera();
    this.setReadout('fs', `F = ${this.engine.appliedForce.toFixed(1)} N（运行中）`);
    this.updateFormula();
  }

  reset() {
    this.started = false;
    this.engine.v0 = this.getVal('v0');
    this.engine.reset();
    this.engine.appliedForce = 0;
    this.engine.recomputeState();
    this.engine.running = false;
    this.simTime = 0;
    this.resetCamera();
    this.clearCharts();
    this.runBtn.textContent = '运行';
    this.setReadout('fs', 'F = 0.00 N');
    this.updateFormula();
  }

  updateFormula() {
    const F = this.engine.appliedForce;
    const m = this.engine.mass;
    const f = this.engine.getFriction();
    const a = this.engine.getAcceleration();
    const t = this.engine.getTime();
    const v0 = this.engine.v0;
    const v = this.engine.getVelocity();
    const s = this.engine.getPosition();
    this.game.setFormula('F_合 = F − f     a = F_合/m     v = v₀ + a·t     s = v₀·t + ½·a·t²');
    this.game.setSubstitution(
      `F_合 = ${F.toFixed(1)} + (${f.toFixed(1)}) = ${(F + f).toFixed(2)} N    a = ${a.toFixed(2)} m/s²`);
    this.game.setResult(
      `v = ${v0.toFixed(2)} + ${a.toFixed(2)}×${t.toFixed(2)} = ${v.toFixed(2)} m/s    s = ${s.toFixed(2)} m`);
  }

  theoryV(t) {
    const a = (this.engine.appliedForce + this.engine.getFriction()) / this.engine.mass;
    return this.engine.v0 + a * t;
  }

  theoryS(t) {
    const a = (this.engine.appliedForce + this.engine.getFriction()) / this.engine.mass;
    return this.engine.v0 * t + 0.5 * a * t * t;
  }

  render() {
    const { ctx, w, h } = prepareCanvas(this.game.canvas);
    if (w <= 10 || h <= 10) return;
    this.drawScene(ctx, w, h);

    if (this.blockY === null) this.blockY = h * 0.72 - this.HALF_H;
    const sx = this.worldToScreenX(this.START_X + this.engine.getPosition());
    const cy = this.blockY;

    ctx.fillStyle = Constants.COLOR_BLOCK;
    ctx.strokeStyle = Constants.COLOR_OUTLINE;
    ctx.lineWidth = 2.5;
    ctx.fillRect(sx - this.HALF_W, cy - this.HALF_H, this.HALF_W * 2, this.HALF_H * 2);
    ctx.strokeRect(sx - this.HALF_W, cy - this.HALF_H, this.HALF_W * 2, this.HALF_H * 2);

    this.vectorDrawer.setBounds(w, h, 12);
    this.vectorDrawer.clear();
    this.vectorDrawer.drawForceBalance(this.engine, { x: sx, y: cy }, h);
    if (this.vectorDrawer.simplified) {
      this.vectorDrawer.drawNetForceArrow(this.engine, { x: sx, y: cy });
    }
    this.vectorDrawer.render(ctx, this.game.fontFamily());

    this.updateFormula();
  }
}

// ---------------- 关卡三 · 牛三定律（碰撞交锋） ----------------

class LevelThree extends LevelBase {
  constructor(game) {
    super(game);
    this.START_A = 2.0;
    this.START_B = 9.0;
    this.START_Y = 3.5;
    this.WORLD_MIN_X = 0.0;
    this.WORLD_MAX_X = 13.5;
    // Y 轴上下边界：中心点受半径 34px 约束后，球体始终落在地面线（h×0.72）之上
    this.WORLD_MIN_Y = 0.7;
    this.WORLD_MAX_Y = 4.6;
    this.RADIUS = 34;
    this.CONTACT_DT = 0.05;
    this.FLASH_DURATION = 0.6;
    // 发射时 Y 轴随机偏转：方向随机，大小在 [MIN, MAX] 内随机，保证每次都是可见的非正碰
    this.RANDOM_VY_MIN = 0.25;
    this.RANDOM_VY_MAX = 1.0;

    this.posA = { x: this.START_A, y: this.START_Y };
    this.posB = { x: this.START_B, y: this.START_Y };
    this.velA = { x: 0, y: 0 };
    this.velB = { x: 0, y: 0 };
    this.launchVy = 0;
    this.launched = false;
    this.flashTime = 0;
    this.flashForce = 0;
    this.flashNormal = { x: 1, y: 0 };
    this.lastCollision = false;
  }

  get title() { return '关卡三 · 碰撞交锋'; }
  get tag() { return '牛顿第三定律 作用力=反作用力 · 必修1 §1.2.3'; }

  setup() {
    this.build(this.game.controlBody);
    this.vectorDrawer.showLabels = false;

    this.sectionTitle('参数调节');
    this.addField('mA', {
      label: 'A 球质量 m_A', min: 1, max: 10, step: 0.5, value: 1.0, unit: 'kg',
      onChange: () => this.updateFormula(),
    });
    this.addField('mB', {
      label: 'B 球质量 m_B', min: 1, max: 10, step: 0.5, value: 1.0, unit: 'kg',
      onChange: () => this.updateFormula(),
    });
    this.addField('vA0', {
      label: 'A 球初速度 v₀', min: 0, max: 8, step: 0.1, value: 5.0, unit: 'm/s',
      onChange: () => this.updateFormula(),
    });
    this.addField('k', {
      label: '阻力系数 k', min: 0, max: 1, step: 0.05, value: 0.3, unit: '',
      onChange: () => this.updateFormula(),
    });

    this.spacer(4);
    this.sectionTitle('操作');
    this.addButton('发射 A 球（带随机 Y 偏转）', 'btn-primary', () => this.launch(this.getVal('vA0')));
    this.addReadout('launch', '本次发射：尚未发射');
    this.spacer(4);
    this.addHint('点击「发射」按设定初速发射 A 球；每次发射的 Y 轴速度分量随机（大小 0.25~1 m/s、\n方向随机），使碰撞必为非正碰，作用力沿两球连心线方向。\n阻力 f = k·v 按速度实时显示；四周墙弹性反弹。');
    this.addButton('重置', null, () => this.reset());

    this.chartVT.setTitle('A 球速率 V-t 图');
    this.chartXT.setTitle('A 球距起点位移 X-t 图');
    this.chartVT.setAutoScale(true);

    this.game.setFormulaTitle('牛顿定律：阻力 f = k·v + 完全弹性碰撞');
    this.reset();
  }

  launch(v0) {
    // Y 轴随机偏转：纵向分量大小在 ±(RANDOM_VY_MIN~MAX) 内随机（方向随机），
    // 使碰撞必然为非正碰，作用力沿两球连心线（法线）方向，更贴近真实情形
    const mag = this.RANDOM_VY_MIN + Math.random() * (this.RANDOM_VY_MAX - this.RANDOM_VY_MIN);
    const vy = Math.random() < 0.5 ? -mag : mag;
    this.posA = { x: this.START_A, y: this.START_Y };
    this.posB = { x: this.START_B, y: this.START_Y };
    this.velA = { x: v0, y: vy };
    this.velB = { x: 0, y: 0 };
    this.launchVy = vy;
    this.launched = true;
    this.lastCollision = false;
    this.flashTime = 0;
    this.simTime = 0;
    this.clearCharts();
    this.setReadout('launch', `本次发射：v_x = ${v0.toFixed(2)} m/s    v_y = ${vy.toFixed(2)} m/s（随机 Y 轴偏转）`);
    this.game.setNote(
      `发射 A 球：v_x = ${v0.toFixed(2)} m/s    v_y = ${vy.toFixed(2)} m/s（随机 Y 轴偏转）\n` +
      '观察碰撞瞬间沿两球连心线方向的等大反向相互作用力');
    this.updateFormula();
  }

  reset() {
    this.posA = { x: this.START_A, y: this.START_Y };
    this.posB = { x: this.START_B, y: this.START_Y };
    this.velA = { x: 0, y: 0 };
    this.velB = { x: 0, y: 0 };
    this.launchVy = 0;
    this.launched = false;
    this.lastCollision = false;
    this.flashTime = 0;
    this.simTime = 0;
    this.clearCharts();
    this.setReadout('launch', '本次发射：尚未发射');
    this.game.setNote('点击「发射」发射 A 球（带随机 Y 轴偏转），观察碰撞瞬间等大反向的相互作用力');
    this.updateFormula();
  }

  stepPhysics(dt) {
    if (!this.launched) return;
    this.simTime += dt;
    const k = this.getVal('k');
    const mA = this.getVal('mA');
    const mB = this.getVal('mB');

    // 阻力 f = −k·v → a = f/m（速度相关的力，实时作用于两球）
    if (k > 0) {
      this.velA.x += (-k * this.velA.x) / mA * dt;
      this.velA.y += (-k * this.velA.y) / mA * dt;
      this.velB.x += (-k * this.velB.x) / mB * dt;
      this.velB.y += (-k * this.velB.y) / mB * dt;
    }
    this.posA.x += this.velA.x * dt;
    this.posA.y += this.velA.y * dt;
    this.posB.x += this.velB.x * dt;
    this.posB.y += this.velB.y * dt;

    // 四周弹性撞墙（墙视为无限质量，法向速度反向）
    let bounced = false;
    const wall = (p, v) => {
      let hit = false;
      if (p.x <= this.WORLD_MIN_X) { p.x = this.WORLD_MIN_X; v.x = Math.abs(v.x); hit = true; }
      else if (p.x >= this.WORLD_MAX_X) { p.x = this.WORLD_MAX_X; v.x = -Math.abs(v.x); hit = true; }
      if (p.y <= this.WORLD_MIN_Y) { p.y = this.WORLD_MIN_Y; v.y = Math.abs(v.y); hit = true; }
      else if (p.y >= this.WORLD_MAX_Y) { p.y = this.WORLD_MAX_Y; v.y = -Math.abs(v.y); hit = true; }
      return hit;
    };
    if (wall(this.posA, this.velA)) bounced = true;
    if (wall(this.posB, this.velB)) bounced = true;
    if (bounced) {
      AudioManager.playCollision();
      this.game.setNote('撞墙反弹（弹性碰撞，动量守恒）：\n法向速度反向，动能不变，球继续运动');
    }

    this.checkCollision();
    this.chartVT.pushValue(this.simTime, Math.hypot(this.velA.x, this.velA.y));
    this.chartXT.pushValue(this.simTime,
      Math.hypot(this.posA.x - this.START_A, this.posA.y - this.START_Y));
  }

  checkCollision() {
    const dx = this.posB.x - this.posA.x;
    const dy = this.posB.y - this.posA.y;
    const contact = 2.0 * this.RADIUS / Constants.PX_PER_METER;
    const dist = Math.hypot(dx, dy);
    if (dist >= contact || dist < 1e-6) return;

    const rx = this.velA.x - this.velB.x;
    const ry = this.velA.y - this.velB.y;
    const nx = dx / dist;
    const ny = dy / dist;
    if (rx * nx + ry * ny <= 0) return; // 分离中，不碰撞

    const mA = this.getVal('mA');
    const mB = this.getVal('mB');
    const relN = rx * nx + ry * ny;
    // 二维完全弹性碰撞：仅交换法线方向分量（切向不变），动量/动能守恒
    const a2x = this.velA.x - (2 * mB / (mA + mB)) * relN * nx;
    const a2y = this.velA.y - (2 * mB / (mA + mB)) * relN * ny;
    const b2x = this.velB.x + (2 * mA / (mA + mB)) * relN * nx;
    const b2y = this.velB.y + (2 * mA / (mA + mB)) * relN * ny;

    // 碰撞平均力估算（冲量定理）：F = m·Δv / Δt
    this.flashForce = mA * Math.hypot(a2x - this.velA.x, a2y - this.velA.y) / this.CONTACT_DT;
    this.flashNormal = { x: nx, y: ny };
    this.flashTime = this.FLASH_DURATION;

    this.velA = { x: a2x, y: a2y };
    this.velB = { x: b2x, y: b2y };
    // 防重叠分离
    const overlap = (contact - dist) * 0.5;
    this.posA.x -= nx * overlap;
    this.posA.y -= ny * overlap;
    this.posB.x += nx * overlap;
    this.posB.y += ny * overlap;

    this.lastCollision = true;
    AudioManager.playCollision();
    this.game.setNote(
      `碰撞！F_A→B = ${this.flashForce.toFixed(0)} N    F_B→A = ${this.flashForce.toFixed(0)} N（等大反向，沿连心线）\n` +
      `v_A' = ${Math.hypot(this.velA.x, this.velA.y).toFixed(2)} m/s    v_B' = ${Math.hypot(this.velB.x, this.velB.y).toFixed(2)} m/s`);
    this.updateFormula();
  }

  updateFormula() {
    const mA = this.getVal('mA');
    const mB = this.getVal('mB');
    const k = this.getVal('k');
    const spdA = Math.hypot(this.velA.x, this.velA.y);
    const spdB = Math.hypot(this.velB.x, this.velB.y);
    const fa = k * spdA;
    const fb = k * spdB;
    const px = mA * this.velA.x + mB * this.velB.x;
    const py = mA * this.velA.y + mB * this.velB.y;
    const p = Math.hypot(px, py);
    this.game.setFormula('阻力 f = k·v（与速度反向）    碰撞：动量守恒 + 动能守恒');
    this.game.setSubstitution(
      `f_A = ${k.toFixed(2)}×${spdA.toFixed(2)} = ${fa.toFixed(2)} N    f_B = ${k.toFixed(2)}×${spdB.toFixed(2)} = ${fb.toFixed(2)} N`);
    const prefix = this.lastCollision ? '碰撞后' : '运动中';
    this.game.setResult(
      `${prefix}：v_A = ${spdA.toFixed(2)} m/s    v_B = ${spdB.toFixed(2)} m/s    总动量 p = ${p.toFixed(2)} kg·m/s`);
  }

  render(dt) {
    const { ctx, w, h } = prepareCanvas(this.game.canvas);
    if (w <= 10 || h <= 10) return;
    this.drawScene(ctx, w, h);

    const ax = this.posA.x * Constants.PX_PER_METER;
    const ay = this.posA.y * Constants.PX_PER_METER;
    const bx = this.posB.x * Constants.PX_PER_METER;
    const by = this.posB.y * Constants.PX_PER_METER;

    // 两球
    for (const c of [{ x: ax, y: ay }, { x: bx, y: by }]) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, this.RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = Constants.COLOR_BLOCK;
      ctx.fill();
      ctx.strokeStyle = Constants.COLOR_OUTLINE;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    this.vectorDrawer.setBounds(w, h, 12);
    this.vectorDrawer.clear();

    // 阻力箭头 f = k·v（与速度反向）
    const k = this.getVal('k');
    if (k > 0) {
      const fa = k * Math.hypot(this.velA.x, this.velA.y);
      if (fa > 0.02) {
        const la = Math.hypot(this.velA.x, this.velA.y);
        this.vectorDrawer.drawArrow({ x: ax, y: ay }, { x: -this.velA.x / la, y: -this.velA.y / la }, fa,
          Constants.COLOR_FRICTION, false, { pos: { x: ax + 6, y: ay - this.RADIUS - 14 }, text: 'f_A' });
      }
      const fb = k * Math.hypot(this.velB.x, this.velB.y);
      if (fb > 0.02) {
        const lb = Math.hypot(this.velB.x, this.velB.y);
        this.vectorDrawer.drawArrow({ x: bx, y: by }, { x: -this.velB.x / lb, y: -this.velB.y / lb }, fb,
          Constants.COLOR_FRICTION, false, { pos: { x: bx + 6, y: by - this.RADIUS - 14 }, text: 'f_B' });
      }
    }

    // 碰撞箭头闪烁（等大反向，沿碰撞法线）
    if (this.flashTime > 0) {
      this.flashTime -= dt;
      const lenPx = Math.min(this.flashForce * Constants.PX_PER_NEWTON, 170);
      this.vectorDrawer.drawArrow({ x: ax, y: ay }, this.flashNormal, lenPx / Constants.PX_PER_NEWTON,
        Constants.COLOR_FORCE, false, null);
      this.vectorDrawer.drawArrow({ x: bx, y: by }, { x: -this.flashNormal.x, y: -this.flashNormal.y },
        lenPx / Constants.PX_PER_NEWTON, Constants.COLOR_FRICTION, false, null);
    }

    this.vectorDrawer.render(ctx, this.game.fontFamily());

    // A/B 球文字标注
    ctx.save();
    ctx.font = `16px ${this.game.fontFamily()}`;
    ctx.fillStyle = Constants.COLOR_TEXT;
    ctx.textAlign = 'left';
    ctx.fillText('A', ax - this.RADIUS * 0.5 - 16, ay - this.RADIUS - 2);
    ctx.fillText('B', bx + this.RADIUS * 0.5 + 2, by - this.RADIUS - 2);
    ctx.restore();

    this.updateFormula();
  }
}

// ---------------- 关卡四 · 抛体运动（平抛轨迹） ----------------

class LevelFour extends LevelBase {
  constructor(game) {
    super(game);
    this.EDGE_X = 0.0;        // 抛出边缘的世界横坐标（与网格原点重合）
    this.RADIUS = 14;         // 抛体为圆形
    this.PX_PER_SPEED = 8;    // 速度矢量比例：1 m/s = 8 px
    this.flying = false;
    this.landed = false;
    this.launched = false;
    this.posX = 0;
    this.dropY = 0;
    this.trace = [];
    this.showPredict = true;
  }

  get title() { return '关卡四 · 平抛轨迹'; }
  get tag() { return '抛体运动 · 运动的合成与分解 · 必修2 §5.2'; }

  setup() {
    this.build(this.game.controlBody);

    this.sectionTitle('参数调节');
    this.addField('v0', {
      label: '初速度 v₀', min: 1, max: 20, step: 0.5, value: 6.0, unit: 'm/s',
      onChange: () => this.onParamChange(),
    });
    // 高度上限受可视范围约束：地面线以上约 5.4 m，留出球体半径余量后取 4.5 m
    this.addField('h', {
      label: '抛出点高度 h', min: 1, max: 4.5, step: 0.5, value: 3.0, unit: 'm',
      onChange: () => this.onParamChange(),
    });
    this.addField('g', {
      label: '重力加速度 g', min: 1.6, max: 20, step: 0.1, value: 9.8, unit: 'm/s²',
      onChange: () => this.onParamChange(),
    });

    this.spacer(4);
    this.sectionTitle('操作');
    this.addButton('抛出（水平初速）', 'btn-primary', () => this.launch());
    this.addReadout('launch', '本次抛出：尚未抛出');
    this.spacer(4);

    this.sectionTitle('显示');
    this.addCheckbox('显示预测轨迹与落点', true, (on) => { this.showPredict = on; });
    this.addHint('平抛可分解为「水平匀速 + 竖直自由落体」：落地时间只由 h 与 g 决定，与 v₀ 无关。\n改参数即可预览绿色虚线预测轨迹与落点，点「抛出」后橙色实线为实际飞过的轨迹。');

    this.addButton('重置', null, () => this.reset());

    this.chartVT.setTitle('V-t 图（合速度）');
    this.chartXT.setTitle('X-t 图（水平位移）');
    this.chartVT.setAutoScale(true);
    this.chartXT.setAutoScale(true);
    this.chartVT.setTheoryFunc((t) => this.theoryV(t));
    this.chartXT.setTheoryFunc((t) => this.theoryX(t));
    this.applyChartScale();

    this.game.setFormulaTitle('平抛运动：水平匀速 + 竖直自由落体');
    this.reset();
  }

  // 图表时间窗与网格步长随落地时间自适应（平抛全场通常不足 3 s）
  applyChartScale() {
    const tLand = Math.sqrt(2 * this.getVal('h') / this.getVal('g'));
    const win = Math.max(isFinite(tLand) ? tLand : 1.0, 0.4);
    const gs = win <= 1.0 ? 0.2 : (win <= 2.5 ? 0.5 : 1.0);
    for (const c of [this.chartVT, this.chartXT]) {
      c.timeWindow = win;
      c.gridStep = gs;
    }
  }

  // 运行中改参数会破坏已飞轨迹与预测的一致性，直接复位
  onParamChange() {
    if (this.flying) this.reset();
    this.applyChartScale();
    this.updateFormula();
  }

  launch() {
    const v0 = this.getVal('v0');
    const g = this.getVal('g');
    const h0 = this.getVal('h');
    const tLand = Math.sqrt(2 * h0 / g);
    this.simTime = 0;
    this.posX = 0;
    this.dropY = 0;
    this.trace = [{ x: 0, y: 0 }];
    this.flying = true;
    this.landed = false;
    this.launched = true;
    this.clearCharts();
    this.applyChartScale();
    this.resetCamera();
    this.chartVT.pushValue(0, v0); // t = 0 时竖直分速度为 0，合速度即 v₀
    this.chartXT.pushValue(0, 0);
    this.setReadout('launch',
      `本次抛出：v₀ = ${v0.toFixed(2)} m/s    h = ${h0.toFixed(2)} m    g = ${g.toFixed(2)} m/s²`);
    this.game.setNote(
      `抛出：水平 v₀ = ${v0.toFixed(2)} m/s，竖直初速 0（自由落体）\n` +
      `落地时间 t = √(2h/g) = ${tLand.toFixed(2)} s    水平射程 x = v₀·t = ${(v0 * tLand).toFixed(2)} m`);
    this.updateFormula();
  }

  reset() {
    this.simTime = 0;
    this.posX = 0;
    this.dropY = 0;
    this.trace = [];
    this.flying = false;
    this.landed = false;
    this.launched = false;
    this.clearCharts();
    this.resetCamera();
    this.setReadout('launch', '本次抛出：尚未抛出');
    this.game.setNote('设置 v₀ / h / g 后点击「抛出」；绿色虚线为预测轨迹与落点，橙色实线为实际飞过的轨迹');
    this.updateFormula();
  }

  stepPhysics(dt) {
    if (!this.flying) return;
    const v0 = this.getVal('v0');
    const g = this.getVal('g');
    const h0 = this.getVal('h');
    const tLand = Math.sqrt(2 * h0 / g);

    // 平抛解析解（水平匀速 + 竖直自由落体），无积分漂移
    let t = this.simTime + dt;
    const landedNow = t >= tLand;
    if (landedNow) t = tLand;
    this.simTime = t;
    const vy = g * t;
    this.posX = v0 * t;
    this.dropY = 0.5 * g * t * t;

    this.trace.push({ x: this.posX, y: this.dropY });
    this.chartVT.pushValue(t, Math.hypot(v0, vy));
    this.chartXT.pushValue(t, this.posX);

    if (landedNow) {
      this.flying = false;
      this.landed = true;
      AudioManager.playCollision();
      const theta = Math.atan2(vy, v0) * 180 / Math.PI;
      this.game.setNote(
        `落地！水平射程 x = ${this.posX.toFixed(2)} m    落地时间 t = ${tLand.toFixed(2)} s\n` +
        `落地速度 v = ${Math.hypot(v0, vy).toFixed(2)} m/s（与水平方向夹角 ${theta.toFixed(1)}°）`);
    }
  }

  updateFormula() {
    const v0 = this.getVal('v0');
    const g = this.getVal('g');
    const h0 = this.getVal('h');
    const tLand = Math.sqrt(2 * h0 / g);
    const range = v0 * tLand;
    const vyL = g * tLand;
    this.game.setFormula('x = v₀·t      y = ½·g·t²      v = √(v₀² + (g·t)²)      落地 t = √(2h/g)');
    this.game.setSubstitution(
      `x = ${v0.toFixed(2)}·t    y = ½×${g.toFixed(2)}·t² = ${(0.5 * g).toFixed(2)}·t²    ` +
      `落地 t = √(2×${h0.toFixed(2)}/${g.toFixed(2)}) = ${tLand.toFixed(2)} s`);

    if (this.landed) {
      const theta = Math.atan2(vyL, v0) * 180 / Math.PI;
      this.game.setResult(
        `落地：t = ${tLand.toFixed(2)} s    x = ${range.toFixed(2)} m    v = ${Math.hypot(v0, vyL).toFixed(2)} m/s    与水平夹角 θ = ${theta.toFixed(1)}°`);
    } else if (this.flying) {
      const t = this.simTime;
      const vy = g * t;
      this.game.setResult(
        `t = ${t.toFixed(2)} s：x = ${(v0 * t).toFixed(2)} m    y = ${(0.5 * g * t * t).toFixed(2)} m    ` +
        `v_x = ${v0.toFixed(2)}    v_y = ${vy.toFixed(2)}    v = ${Math.hypot(v0, vy).toFixed(2)} m/s`);
    } else {
      this.game.setResult(
        `预测：落地时间 t = ${tLand.toFixed(2)} s    水平射程 x = ${range.toFixed(2)} m    落地速度 v = ${Math.hypot(v0, vyL).toFixed(2)} m/s`);
    }
  }

  theoryV(t) {
    return Math.hypot(this.getVal('v0'), this.getVal('g') * t);
  }

  theoryX(t) {
    return this.getVal('v0') * t;
  }

  render() {
    const { ctx, w, h } = prepareCanvas(this.game.canvas);
    if (w <= 10 || h <= 10) return;
    this.drawScene(ctx, w, h);

    const groundY = h * 0.72;
    const v0 = this.getVal('v0');
    const g = this.getVal('g');
    const h0 = this.getVal('h');
    const tLand = Math.sqrt(2 * h0 / g);
    const range = v0 * tLand;
    const step = Constants.PX_PER_METER;

    // 相机横向跟随抛体；纵向以地面线为基准（1 m = 60 px，与网格同尺度）
    // 台面位于地面线以上 h 米处，抛体圆心在台面上方一个半径：落地时球体恰好停在地面线上
    const ballScreenX = this.worldToScreenX(this.posX);
    const edgeX = this.EDGE_X * step - this.camScroll;
    const topY = groundY - h0 * step;
    const ballBaseY = groundY - this.RADIUS;
    const ballY = ballBaseY - (h0 - this.dropY) * step;

    // 预测轨迹（绿虚线 = 理论曲线）
    if (this.showPredict) {
      ctx.save();
      ctx.strokeStyle = rgba(Constants.COLOR_THEORY, 0.75);
      ctx.lineWidth = 1.8;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      const n = 96;
      for (let i = 0; i <= n; i++) {
        const t = tLand * i / n;
        const px = v0 * t * step - this.camScroll;
        const py = ballBaseY - (h0 - 0.5 * g * t * t) * step;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.restore();
    }

    // 抛出台（悬崖 / 桌沿）
    ctx.fillStyle = 'rgba(198,198,189,0.55)';
    ctx.fillRect(0, topY, Math.max(edgeX, 0), groundY - topY);
    ctx.strokeStyle = Constants.COLOR_OUTLINE;
    ctx.lineWidth = 2;
    ctx.strokeRect(0.5, topY, Math.max(edgeX - 1, 0), groundY - topY);
    ctx.strokeStyle = Constants.COLOR_GROUND;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, topY);
    ctx.lineTo(edgeX, topY);
    ctx.stroke();

    // 已飞出轨迹（橙实线 = 高亮）
    if (this.trace.length > 1) {
      ctx.save();
      ctx.strokeStyle = Constants.COLOR_HIGHLIGHT;
      ctx.lineWidth = 2.5;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < this.trace.length; i++) {
        const px = this.trace[i].x * step - this.camScroll;
        const py = ballBaseY - (h0 - this.trace[i].y) * step;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.restore();
    }

    // 落点标记
    if (this.showPredict) {
      const landX = range * step - this.camScroll;
      ctx.save();
      ctx.fillStyle = Constants.COLOR_HIGHLIGHT;
      ctx.beginPath();
      ctx.arc(landX, groundY, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = `13px ${this.game.fontFamily()}`;
      ctx.textAlign = 'center';
      ctx.fillText(`落点 x = ${range.toFixed(2)} m`, landX, groundY + 20);
      ctx.restore();
    }

    // 抛出点高度标注（贴台面右上角）
    ctx.save();
    ctx.font = `13px ${this.game.fontFamily()}`;
    ctx.fillStyle = Constants.COLOR_TEXT_DIM;
    ctx.textAlign = 'right';
    ctx.fillText(`h = ${h0.toFixed(2)} m`, edgeX - 8, topY - 8);
    ctx.restore();

    // 抛体（圆形）
    ctx.beginPath();
    ctx.arc(ballScreenX, ballY, this.RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = Constants.COLOR_BLOCK;
    ctx.fill();
    ctx.strokeStyle = Constants.COLOR_OUTLINE;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // 速度分解矢量：v_x（蓝，恒定）与 v_y（红，= g·t）
    if (this.launched) {
      const tEff = this.flying ? this.simTime : tLand;
      const vy = g * tEff;
      const s = this.PX_PER_SPEED;
      this.vectorDrawer.setBounds(w, h, 12);
      this.vectorDrawer.clear();
      this.vectorDrawer.drawArrow({ x: ballScreenX, y: ballY }, { x: 1, y: 0 }, v0,
        Constants.COLOR_FRICTION, false,
        { pos: { x: ballScreenX + v0 * s + 6, y: ballY + 5 }, text: 'v_x' }, s);
      this.vectorDrawer.drawArrow({ x: ballScreenX, y: ballY }, { x: 0, y: 1 }, vy,
        Constants.COLOR_FORCE, false,
        { pos: { x: ballScreenX - 28, y: ballY + vy * s + 16 }, text: 'v_y' }, s);
      this.vectorDrawer.render(ctx, this.game.fontFamily());
    }

    this.updateFormula();
  }
}

</script>
<script>
// 物理仿真弹窗：匀变速直线运动「4 类公式自动匹配」求解 + 运动动画与 v-t / x-t 曲线

// ---------------- 题目类型 ----------------
const SIM_TYPES = [
  { key: 'linear', name: '匀变速直线运动', ready: true },
  { key: 'projectile', name: '平抛运动', ready: false, note: '暂定' },
];

// ---------------- 数据输入（4 组共 8 个输入框）----------------
// primary: 参与「知三求二」的已知量；其余为过程记录项，不参与公式求解
const SIM_GROUPS = [
  { title: '速度数据（变化）', fields: [
    { key: 'v0', label: '变化初始值 v₀', unit: 'm/s', primary: true },
    { key: 'v', label: '变化最终值 v', unit: 'm/s', primary: true },
  ] },
  { title: '加速度相关参数', fields: [
    { key: 'a', label: '加速度大小 a', unit: 'm/s²', primary: true },
    { key: 't', label: '加速度作用时间 t', unit: 's', primary: true },
  ] },
  { title: '位移数据（变化）', fields: [
    { key: 'x', label: '变化最终值 x', unit: 'm', primary: true },
  ] },
];

const SIM_PRIMARY = ['v0', 'v', 'a', 't', 'x'];
const SIM_SYMBOL = { v0: 'v₀', v: 'v', a: 'a', t: 't', x: 'x' };
const SIM_UNIT = { v0: 'm/s', v: 'm/s', a: 'm/s²', t: 's', x: 'm' };
const SIM_EPS = 1e-9;

function simNum(v, digits) {
  if (typeof v !== 'number' || !isFinite(v)) return '—';
  const d = digits === undefined ? 3 : digits;
  const r = Number(v.toFixed(d));
  return (Object.is(r, -0) ? 0 : r).toString();
}

function simFail(msg) { return { error: msg }; }

// ---------------- 10 组「知三求二」求解式 ----------------
const SIM_SOLVERS = {
  // 已知 v₀、a、t
  'a,t,v0': (k) => {
    const v = k.v0 + k.a * k.t;
    const x = k.v0 * k.t + 0.5 * k.a * k.t * k.t;
    return { values: { v, x }, steps: [
      { id: 'f1', text: `v = v₀ + a·t = ${simNum(k.v0)} + ${simNum(k.a)} × ${simNum(k.t)} = ${simNum(v)} m/s` },
      { id: 'f2', text: `x = v₀·t + ½·a·t² = ${simNum(k.v0)} × ${simNum(k.t)} + ½ × ${simNum(k.a)} × ${simNum(k.t)}² = ${simNum(x)} m` },
    ] };
  },

  // 已知 v、a、t
  'a,t,v': (k) => {
    const v0 = k.v - k.a * k.t;
    const x = (v0 + k.v) / 2 * k.t;
    return { values: { v0, x }, steps: [
      { id: 'f1', text: `由 v = v₀ + a·t 反解：v₀ = v - a·t = ${simNum(k.v)} - ${simNum(k.a)} × ${simNum(k.t)} = ${simNum(v0)} m/s` },
      { id: 'f4', text: `x = (v₀ + v)/2 · t = (${simNum(v0)} + ${simNum(k.v)}) / 2 × ${simNum(k.t)} = ${simNum(x)} m` },
    ] };
  },

  // 已知 a、t、x
  'a,t,x': (k) => {
    if (Math.abs(k.t) < SIM_EPS) return simFail('时间 t = 0 时位移必为 0，无法由 x 反求 v₀，请改填其它已知量');
    const v0 = (k.x - 0.5 * k.a * k.t * k.t) / k.t;
    const v = v0 + k.a * k.t;
    return { values: { v0, v }, steps: [
      { id: 'f2', text: `由 x = v₀·t + ½·a·t² 反解：v₀ = (x - ½·a·t²) / t = (${simNum(k.x)} - ½ × ${simNum(k.a)} × ${simNum(k.t)}²) / ${simNum(k.t)} = ${simNum(v0)} m/s` },
      { id: 'f1', text: `v = v₀ + a·t = ${simNum(v0)} + ${simNum(k.a)} × ${simNum(k.t)} = ${simNum(v)} m/s` },
    ] };
  },

  // 已知 v₀、v、a
  'a,v,v0': (k) => {
    if (Math.abs(k.a) < SIM_EPS) return simFail('加速度 a = 0 时 v 必等于 v₀，无法由二者确定时间 t，请改填其它已知量');
    const t = (k.v - k.v0) / k.a;
    if (t < -1e-9) return simFail(`求得 t = ${simNum(t)} s 为负，与「加速度作用时间」矛盾，请检查数据`);
    const x = (k.v0 + k.v) / 2 * t;
    return { values: { t, x }, steps: [
      { id: 'f1', text: `由 v = v₀ + a·t 反解：t = (v - v₀) / a = (${simNum(k.v)} - ${simNum(k.v0)}) / ${simNum(k.a)} = ${simNum(t)} s` },
      { id: 'f4', text: `x = (v₀ + v)/2 · t = (${simNum(k.v0)} + ${simNum(k.v)}) / 2 × ${simNum(t)} = ${simNum(x)} m` },
    ] };
  },

  // 已知 v、a、x
  'a,v,x': (k) => {
    const D = k.v * k.v - 2 * k.a * k.x;
    if (D < -SIM_EPS) return simFail(`由 v² = v₀² + 2a·x 得 v₀² = ${simNum(D)} < 0，该组数据无实数解`);
    const s = Math.sqrt(Math.max(D, 0));
    let v0, t, stepT;
    if (Math.abs(k.a) < SIM_EPS) {
      v0 = k.v;
      if (Math.abs(v0) < SIM_EPS) return simFail('a = 0 且 v = 0 时位移不为 0，数据矛盾，请改填其它已知量');
      t = k.x / v0;
      stepT = { id: 'f2', text: `a = 0（匀速）：x = v·t，故 t = x / v = ${simNum(k.x)} / ${simNum(v0)} = ${simNum(t)} s` };
    } else {
      const cands = [s, -s].map((c) => ({ c, tc: (k.v - c) / k.a }))
        .filter((o) => o.tc >= -1e-9)
        .sort((o1, o2) => o1.tc - o2.tc);
      if (!cands.length) return simFail('由 v² = v₀² + 2a·x 解出的两个 v₀ 对应时间均为负，数据不合理');
      v0 = cands[0].c;
      t = cands[0].tc;
      stepT = { id: 'f1', text: `t = (v - v₀) / a = (${simNum(k.v)} - ${simNum(v0)}) / ${simNum(k.a)} = ${simNum(t)} s` };
      if (cands.length > 1) {
        stepT.text += `（另一根 v₀ = ${simNum(cands[1].c)} m/s 对应 t = ${simNum(cands[1].tc)} s 也成立，此处取 t 较小的解）`;
      }
    }
    return { values: { v0, t }, steps: [
      { id: 'f3', text: `由 v² = v₀² + 2a·x 反解：v₀² = v² - 2a·x = ${simNum(k.v)}² - 2 × ${simNum(k.a)} × ${simNum(k.x)} = ${simNum(D)}` },
      { id: 'f3', text: `v₀ = ±√${simNum(Math.max(D, 0))} = ±${simNum(s)} m/s，取 v₀ = ${simNum(v0)} m/s（满足 t ≥ 0）` },
      stepT,
    ] };
  },

  // 已知 v₀、a、x
  'a,v0,x': (k) => {
    const D = k.v0 * k.v0 + 2 * k.a * k.x;
    if (D < -SIM_EPS) return simFail(`由 v² = v₀² + 2a·x 得 v² = ${simNum(D)} < 0，该组数据无实数解`);
    const s = Math.sqrt(Math.max(D, 0));
    let v, t, stepT;
    if (Math.abs(k.a) < SIM_EPS) {
      v = k.v0;
      if (Math.abs(v) < SIM_EPS) return simFail('a = 0 且 v₀ = 0 时位移不为 0，数据矛盾，请改填其它已知量');
      t = k.x / v;
      stepT = { id: 'f2', text: `a = 0（匀速）：x = v₀·t，故 t = x / v₀ = ${simNum(k.x)} / ${simNum(v)} = ${simNum(t)} s` };
    } else {
      const cands = [s, -s].map((c) => ({ c, tc: (c - k.v0) / k.a }))
        .filter((o) => o.tc >= -1e-9)
        .sort((o1, o2) => o1.tc - o2.tc);
      if (!cands.length) return simFail('由 v² = v₀² + 2a·x 解出的两个 v 对应时间均为负，数据不合理');
      v = cands[0].c;
      t = cands[0].tc;
      stepT = { id: 'f1', text: `t = (v - v₀) / a = (${simNum(v)} - ${simNum(k.v0)}) / ${simNum(k.a)} = ${simNum(t)} s` };
      if (cands.length > 1) {
        stepT.text += `（另一根 v = ${simNum(cands[1].c)} m/s 对应 t = ${simNum(cands[1].tc)} s 也成立，此处取 t 较小的解）`;
      }
    }
    return { values: { v, t }, steps: [
      { id: 'f3', text: `由 v² = v₀² + 2a·x 求解：v² = v₀² + 2a·x = ${simNum(k.v0)}² + 2 × ${simNum(k.a)} × ${simNum(k.x)} = ${simNum(D)}` },
      { id: 'f3', text: `v = ±√${simNum(Math.max(D, 0))} = ±${simNum(s)} m/s，取 v = ${simNum(v)} m/s（满足 t ≥ 0）` },
      stepT,
    ] };
  },

  // 已知 v₀、v、t
  't,v,v0': (k) => {
    if (Math.abs(k.t) < SIM_EPS) return simFail('时间 t = 0 时 v 必等于 v₀，加速度无法确定，请改填其它已知量');
    const a = (k.v - k.v0) / k.t;
    const x = (k.v0 + k.v) / 2 * k.t;
    return { values: { a, x }, steps: [
      { id: 'f1', text: `由 v = v₀ + a·t 反解：a = (v - v₀) / t = (${simNum(k.v)} - ${simNum(k.v0)}) / ${simNum(k.t)} = ${simNum(a)} m/s²` },
      { id: 'f4', text: `x = (v₀ + v)/2 · t = (${simNum(k.v0)} + ${simNum(k.v)}) / 2 × ${simNum(k.t)} = ${simNum(x)} m` },
    ] };
  },

  // 已知 v、t、x
  't,v,x': (k) => {
    if (Math.abs(k.t) < SIM_EPS) return simFail('时间 t = 0 时位移必为 0，无法由 x 反求 v₀，请改填其它已知量');
    const v0 = 2 * k.x / k.t - k.v;
    const a = (k.v - v0) / k.t;
    return { values: { v0, a }, steps: [
